<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="300" viewBox="0 0 1600 300" role="img" aria-labelledby="title desc">
<title id="title">JANASETU ಜನಸೇತು — handshake and Karnataka</title>
<desc id="desc">A recognizable blue handshake with two cuffed hands, JANASETU in English and Kannada, and a Karnataka state outline.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fbfdff"/><stop offset=".58" stop-color="#eaf5ff"/><stop offset="1" stop-color="#d8edff"/></linearGradient>
 <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#073b83"/><stop offset=".55" stop-color="#087bc5"/><stop offset="1" stop-color="#159fdf"/></linearGradient>
 <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#073b83"/><stop offset=".55" stop-color="#0876c7"/><stop offset="1" stop-color="#159fe0"/></linearGradient>
</defs>
