<text x="370" y="126" font-family="Arial,sans-serif" font-size="78" font-weight="800" letter-spacing="3" fill="#073b83">JANASETU</text>
<text x="374" y="188" font-family="'Noto Sans Kannada','Noto Sans',sans-serif" font-size="55" font-weight="700" fill="#0868ad">ಜನಸೇತು</text>
<text x="378" y="231" font-family="Arial,sans-serif" font-size="23" font-style="italic" font-weight="600" fill="#174779">Your Voice. Our Community. Better Tomorrow.</text>
